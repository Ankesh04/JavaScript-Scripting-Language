<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ankesh Agarwal</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const sayAnkesh = function(){
        console.log("Ankesh");
    }
    const changeText = function(){
        document.querySelector('h1').innerHTML = "JavaScript Async"
    }

    const changeMe = setTimeout(changeText, 2000)
    //this settimeout move out side of the code and goes to event queue
    //this set timeout wait for two second and then the text is changed
    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeMe)
        console.log("STOPPED")
    })
</script>
</html>
